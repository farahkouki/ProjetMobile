name: volontariat_app
description: Demo Volontariat (CRUD + Search + Geo + IA locale) tout en Flutter
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de données (mobile + web)
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5+4
  path: ^1.9.0
  path_provider: ^2.1.4

  # Utilitaires
  intl: ^0.19.0
  geolocator: ^12.0.0

  # Upload d’images (web/mobile)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
